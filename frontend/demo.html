<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendia Widget Demo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4eadf; color: #2f231d; font: 16px Georgia, serif; }
    main { width: min(680px, calc(100% - 40px)); }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; }
    p { max-width: 46ch; font: 16px Arial, sans-serif; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Atendia</h1>
    <p>Esta página permite validar el widget durante el piloto. Sustituye el valor de <code>data-bot-key</code> por la clave pública devuelta al crear un bot.</p>
  </main>
  <script src="widget.js" data-api-url="https://localhost:5001" data-bot-key="atd_REPLACE_WITH_BOT_KEY" data-title="Atendia"></script>
</body>
</html>
